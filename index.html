<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>身體王國大冒險</title>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- turn.js -->
<script src="https://cdn.jsdelivr.net/gh/blasten/turn.js/turn.min.js"></script>

<style>

body{

    margin:0;

    overflow:hidden;

    background:
    linear-gradient(
    to bottom,
    #ffd6ec,
    #dff6ff
    );

    font-family:
    "Noto Sans TC",
    sans-serif;
}
.author{

    position:fixed;

    top:20px;

    left:50%;

    transform:translateX(-50%);

    font-size:1.1rem;

    color:#7a4b5f;

    background:rgba(255,255,255,0.7);

    padding:10px 22px;

    border-radius:999px;

    backdrop-filter:blur(6px);

    z-index:99999;

    pointer-events:none;
}
/* 書本置中 */

.book-layout{

    width:100vw;

    height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:40px;

    padding:40px;

    box-sizing:border-box;
}

.intro{

    width:420px;

    background:rgba(255,255,255,0.55);

    backdrop-filter:blur(10px);

    border-radius:30px;

    padding:35px;

    color:#7a4b5f;

    line-height:1.9;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.08);
}

.intro h1{

    font-size:2.3rem;

    margin-top:0;

    color:#ff5fa2;
}

.intro h2{

    margin-top:25px;

    color:#ff7eb6;
}

.book-container{

    display:flex;

    justify-content:center;

    align-items:center;
}

/* 書本 */

#flipbook{

    width:1400px;

    height:700px;
}

/* 每頁 */

#flipbook .page{
    box-shadow:none !important;
    background:transparent;

    overflow:hidden;

    margin:0;

    padding:0;
}
/* 圖片 */

#flipbook img{

    width:100%;

    height:100%;

    object-fit:fill;

    background:transparent;

    display:block;
}

/* 按鈕 */

.controls{

    position:fixed;

    bottom:20px;

    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:20px;

    z-index:999;
}

button{

    padding:14px 28px;

    border:none;

    border-radius:999px;

    background:#ff90c2;

    color:white;

    font-size:1rem;

    cursor:pointer;

    transition:0.3s;
}

button:hover{

    background:#ff5fa2;

    transform:scale(1.05);
}

/* 手機 */

@media(max-width:1100px){

    #flipbook{

        width:95vw;

        height:65vw;
    }
}

</style>

</head>

<body>
<div class="author">

作者：高芮妮、李涵羚、張鈺汶

</div>
<div class="book-layout">

<div class="intro">

<h1>
📖 身體王國大冒險
</h1>

<h2>
製作動機
</h2>

<p>
我們希望用可愛的童話故事，
讓大家更容易理解免疫系統、
細菌與病毒之間的關係。

透過妮妮、文文與TEX隊長的冒險，
讓原本困難的生物知識，
變成像繪本一樣有趣！
</p>

<h2>
故事大綱
</h2>

<p>
在身體王國裡，
細胞們每天努力維持健康。

有一天，
神秘的莉娜來到王國，
妮妮好心收留了她，
卻讓病毒開始悄悄擴散……

最後，
TEX免疫軍團與B博士一起守護王國，
也讓妮妮學會：
善良的同時，
也要懂得保護自己。
</p>

</div>

<div class="book-container">
<div id="flipbook">

    <!-- 封面 -->
    <div class="page">
    <img src="page1.jpg">
    </div>

    <!-- 內頁 -->
    <div class="page"><img src="page2.jpg"></div>
    <div class="page"><img src="page3.jpg"></div>
    <div class="page"><img src="page4.jpg"></div>
    <div class="page"><img src="page5.jpg"></div>
    <div class="page"><img src="page6.jpg"></div>
    <div class="page"><img src="page7.jpg"></div>
    <div class="page"><img src="page8.jpg"></div>
    <div class="page"><img src="page9.jpg"></div>
    <div class="page"><img src="page10.jpg"></div>
    <div class="page"><img src="page11.jpg"></div>
    <div class="page"><img src="page12.jpg"></div>
    <div class="page"><img src="page13.jpg"></div>
    <div class="page"><img src="page14.jpg"></div>
    <div class="page"><img src="page15.jpg"></div>
    <div class="page"><img src="page16.jpg"></div>
    <div class="page"><img src="page17.jpg"></div>
    <div class="page"><img src="page18.jpg"></div>
    <div class="page"><img src="page19.jpg"></div>

    <!-- 封底 -->
    <div class="page">
    <img src="page20.jpg">
    </div>

</div>

</div>

<!-- 按鈕 -->

<div class="controls">

<button id="prevBtn">
⬅ 上一頁
</button>

<button id="nextBtn">
下一頁 ➡
</button>

</div>

<script>

/* 建立翻頁書 */

$("#flipbook").turn({

    width:1400,

    height:700,

    autoCenter:true,

    gradients:true,

    elevation:50,

    duration:1200

});

/* 按鈕翻頁 */

document
.getElementById("nextBtn")
.addEventListener(
"click",

function(){

    $("#flipbook")
    .turn("next");
});

document
.getElementById("prevBtn")
.addEventListener(
"click",

function(){

    $("#flipbook")
    .turn("previous");
});

/* 鍵盤左右鍵 */

document.addEventListener(
"keydown",

function(e){

    if(e.key==="ArrowRight"){

        $("#flipbook")
        .turn("next");
    }

    if(e.key==="ArrowLeft"){

        $("#flipbook")
        .turn("previous");
    }
});

/* 手機左右滑 */

let startX = 0;

document.addEventListener(
"touchstart",

function(e){

    startX =
    e.changedTouches[0].screenX;
});

document.addEventListener(
"touchend",

function(e){

    let endX =
    e.changedTouches[0].screenX;

    /* 左滑 */

    if(startX - endX > 50){

        $("#flipbook")
        .turn("next");
    }

    /* 右滑 */

    if(endX - startX > 50){

        $("#flipbook")
        .turn("previous");
    }
});

</script>

</body>
</html>
