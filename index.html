<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>身體王國大冒險</title>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- turn.js -->
<script src="https://cdn.jsdelivr.net/gh/blasten/turn.js/turn.min.js"></script>

<style>

body{

    margin:0;

    overflow:hidden;

    background:
    linear-gradient(
    to bottom,
    #ffd6ec,
    #dff6ff
    );

    font-family:
    "Noto Sans TC",
    sans-serif;
}

/* 書本置中 */

.book-container{

    width:100vw;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;
}

/* 書本 */

#flipbook{

    width:1200px;

    height:900px;
}

/* 每頁 */

#flipbook .page{

    background:white;

    overflow:hidden;
}

/* 圖片 */

#flipbook img{

    width:100%;

    height:100%;

    object-fit:contain;

    background:white;
}

/* 按鈕 */

.controls{

    position:fixed;

    bottom:20px;

    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:20px;

    z-index:999;
}

button{

    padding:14px 28px;

    border:none;

    border-radius:999px;

    background:#ff90c2;

    color:white;

    font-size:1rem;

    cursor:pointer;

    transition:0.3s;
}

button:hover{

    background:#ff5fa2;

    transform:scale(1.05);
}

/* 手機 */

@media(max-width:1100px){

    #flipbook{

        width:95vw;

        height:65vw;
    }
}

</style>

</head>

<body>

<div class="book-container">

<div id="flipbook">

    <!-- 封面 -->
    <div class="page">
    <img src="page1.jpg">
    </div>

    <!-- 內頁 -->
    <div class="page"><img src="page2.jpg"></div>
    <div class="page"><img src="page3.jpg"></div>
    <div class="page"><img src="page4.jpg"></div>
    <div class="page"><img src="page5.jpg"></div>
    <div class="page"><img src="page6.jpg"></div>
    <div class="page"><img src="page7.jpg"></div>
    <div class="page"><img src="page8.jpg"></div>
    <div class="page"><img src="page9.jpg"></div>
    <div class="page"><img src="page10.jpg"></div>
    <div class="page"><img src="page11.jpg"></div>
    <div class="page"><img src="page12.jpg"></div>
    <div class="page"><img src="page13.jpg"></div>
    <div class="page"><img src="page14.jpg"></div>
    <div class="page"><img src="page15.jpg"></div>
    <div class="page"><img src="page16.jpg"></div>
    <div class="page"><img src="page17.jpg"></div>
    <div class="page"><img src="page18.jpg"></div>
    <div class="page"><img src="page19.jpg"></div>

    <!-- 封底 -->
    <div class="page">
    <img src="page20.jpg">
    </div>

</div>

</div>

<!-- 按鈕 -->

<div class="controls">

<button id="prevBtn">
⬅ 上一頁
</button>

<button id="nextBtn">
下一頁 ➡
</button>

</div>

<script>

/* 建立翻頁書 */

$("#flipbook").turn({

    width:1000,

    height:700,

    autoCenter:true,

    gradients:true,

    elevation:50,

    duration:1200

});

/* 按鈕翻頁 */

document
.getElementById("nextBtn")
.addEventListener(
"click",

function(){

    $("#flipbook")
    .turn("next");
});

document
.getElementById("prevBtn")
.addEventListener(
"click",

function(){

    $("#flipbook")
    .turn("previous");
});

/* 鍵盤左右鍵 */

document.addEventListener(
"keydown",

function(e){

    if(e.key==="ArrowRight"){

        $("#flipbook")
        .turn("next");
    }

    if(e.key==="ArrowLeft"){

        $("#flipbook")
        .turn("previous");
    }
});

/* 手機左右滑 */

let startX = 0;

document.addEventListener(
"touchstart",

function(e){

    startX =
    e.changedTouches[0].screenX;
});

document.addEventListener(
"touchend",

function(e){

    let endX =
    e.changedTouches[0].screenX;

    /* 左滑 */

    if(startX - endX > 50){

        $("#flipbook")
        .turn("next");
    }

    /* 右滑 */

    if(endX - startX > 50){

        $("#flipbook")
        .turn("previous");
    }
});

</script>

</body>
</html>
