<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>身體王國大冒險</title>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/turn.js@4/turn.min.js"></script>

<style>

body{

    margin:0;

    background:
    linear-gradient(
    to bottom,
    #ffd6ec,
    #dff6ff
    );

    overflow:hidden;

    font-family:
    "Noto Sans TC",
    sans-serif;
}

/* 封面畫面 */

#start-screen{

    width:100vw;

    height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;
}

#start-screen h1{

    font-size:4rem;

    color:#ff4f93;

    margin-bottom:10px;
}

#start-screen p{

    font-size:1.4rem;

    color:#666;
}

button{

    padding:15px 35px;

    border:none;

    border-radius:999px;

    background:#ff90c2;

    color:white;

    font-size:1.1rem;

    cursor:pointer;

    transition:0.3s;
}

button:hover{

    background:#ff5fa2;

    transform:scale(1.05);
}

/* 書本 */

#book-container{

    width:100vw;

    height:100vh;

    display:none;

    justify-content:center;

    align-items:center;
}

#flipbook{

    width:1000px;

    height:700px;
}

#flipbook div{

    background:white;
}

#flipbook img{

    width:100%;

    height:100%;

    object-fit:cover;
}

/* 翻頁陰影 */

.turn-page{

    box-shadow:
    0 0 20px rgba(0,0,0,0.2);
}

.controls{

    position:fixed;

    bottom:20px;

    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:20px;
}

@media(max-width:1100px){

    #flipbook{

        width:95vw;

        height:65vw;
    }

    #start-screen h1{

        font-size:2.5rem;
    }
}

</style>

</head>

<body>

<!-- 封面首頁 -->

<div id="start-screen">

    <h1>
    📖 身體王國大冒險
    </h1>

    <p>
    細胞、細菌與病毒的友情故事
    </p>

    <button onclick="startBook()">
    開始閱讀 ✨
    </button>

</div>

<!-- 書本 -->

<div id="book-container">

<div id="flipbook">

    <!-- 封面 -->

    <div>
    <img src="page1.jpg">
    </div>

    <!-- 內頁 -->

    <div><img src="page2.jpg"></div>
    <div><img src="page3.jpg"></div>
    <div><img src="page4.jpg"></div>
    <div><img src="page5.jpg"></div>
    <div><img src="page6.jpg"></div>
    <div><img src="page7.jpg"></div>
    <div><img src="page8.jpg"></div>
    <div><img src="page9.jpg"></div>
    <div><img src="page10.jpg"></div>
    <div><img src="page11.jpg"></div>
    <div><img src="page12.jpg"></div>
    <div><img src="page13.jpg"></div>
    <div><img src="page14.jpg"></div>
    <div><img src="page15.jpg"></div>
    <div><img src="page16.jpg"></div>
    <div><img src="page17.jpg"></div>
    <div><img src="page18.jpg"></div>
    <div><img src="page19.jpg"></div>

    <!-- 封底 -->

    <div>
    <img src="page20.jpg">
    </div>

</div>

<div class="controls">

<button onclick="prevPage()">
⬅ 上一頁
</button>

<button onclick="nextPage()">
下一頁 ➡
</button>

</div>

</div>

<script>

/* 開始閱讀 */

function startBook(){

    document
    .getElementById("start-screen")
    .style.display = "none";

    document
    .getElementById("book-container")
    .style.display = "flex";

    $("#flipbook").turn({

        width:1000,

        height:700,

        autoCenter:true,

        gradients:true,

        elevation:50,

        duration:1200

    });

    /* 自動翻開封面動畫 */

    setTimeout(function(){

        $("#flipbook").turn("next");

    },500);
}

/* 下一頁 */

function nextPage(){

    $("#flipbook")
    .turn("next");
}

/* 上一頁 */

function prevPage(){

    $("#flipbook")
    .turn("previous");
}

/* 鍵盤翻頁 */

document.addEventListener(
"keydown",

function(e){

    if(e.key==="ArrowRight"){

        nextPage();
    }

    if(e.key==="ArrowLeft"){

        prevPage();
    }
});

</script>

</body>
</html>
