<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>身體王國大冒險</title>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/turn.js@4/turn.min.js"></script>

<style>

body{

    margin:0;

    background:
    linear-gradient(
    to bottom,
    #ffd6ec,
    #dff6ff
    );

    overflow-x:hidden;

    font-family:
    "Noto Sans TC",
    sans-serif;
}

.cover{

    height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;
}

.cover h1{

    font-size:4rem;

    color:#ff4f93;
}

.cover p{

    font-size:1.4rem;

    color:#555;
}

button{

    padding:15px 30px;

    border:none;

    border-radius:999px;

    background:#ff90c2;

    color:white;

    font-size:1.1rem;

    cursor:pointer;

    transition:0.3s;
}

button:hover{

    background:#ff5fa2;

    transform:scale(1.05);
}

.hidden{

    display:none;
}

#book-wrapper{

    display:flex;

    flex-direction:column;

    align-items:center;

    padding:40px 0;
}

#flipbook{

    width:1000px;

    height:700px;
}

#flipbook div{

    background:white;
}

#flipbook img{

    width:100%;

    height:100%;

    object-fit:contain;
}

.controls{

    margin-top:25px;

    display:flex;

    gap:20px;
}

@media(max-width:1100px){

    #flipbook{

        width:95vw;

        height:65vw;
    }

    .cover h1{

        font-size:2.5rem;
    }
}

</style>

</head>

<body>

<div class="cover">

    <h1>
    📖 身體王國大冒險
    </h1>

    <p>
    細胞、細菌與病毒的友情故事
    </p>

    <button onclick="openBook()">
    開始閱讀 ✨
    </button>

</div>

<div id="book-wrapper"
class="hidden">

<div id="flipbook">

    <!-- 封面 -->

    <div>
    <img src="images/page1.jpg">
    </div>

    <!-- 內頁 -->

    <div>
    <img src="images/page2.jpg">
    </div>

    <div>
    <img src="images/page3.jpg">
    </div>

    <div>
    <img src="images/page4.jpg">
    </div>

    <div>
    <img src="images/page5.jpg">
    </div>

    <div>
    <img src="images/page6.jpg">
    </div>

    <div>
    <img src="images/page7.jpg">
    </div>

    <div>
    <img src="images/page8.jpg">
    </div>

    <div>
    <img src="images/page9.jpg">
    </div>

    <div>
    <img src="images/page10.jpg">
    </div>

    <div>
    <img src="images/page11.jpg">
    </div>

    <div>
    <img src="images/page12.jpg">
    </div>

    <div>
    <img src="images/page13.jpg">
    </div>

    <div>
    <img src="images/page14.jpg">
    </div>

    <div>
    <img src="images/page15.jpg">
    </div>

    <div>
    <img src="images/page16.jpg">
    </div>

    <div>
    <img src="images/page17.jpg">
    </div>

    <div>
    <img src="images/page18.jpg">
    </div>

    <div>
    <img src="images/page19.jpg">
    </div>

    <!-- 封底 -->

    <div>
    <img src="images/page20.jpg">
    </div>

</div>

<div class="controls">

<button onclick="prevPage()">
⬅ 上一頁
</button>

<button onclick="nextPage()">
下一頁 ➡
</button>

</div>

</div>

<script>

function openBook(){

    document
    .getElementById("book-wrapper")
    .classList
    .remove("hidden");

    $("#flipbook").turn({

        width:1000,

        height:700,

        autoCenter:true,

        gradients:true,

        elevation:50

    });

    window.scrollTo({

        top:document
        .getElementById("book-wrapper")
        .offsetTop,

        behavior:"smooth"

    });
}

function nextPage(){

    $("#flipbook")
    .turn("next");
}

function prevPage(){

    $("#flipbook")
    .turn("previous");
}

document.addEventListener(
"keydown",

function(e){

    if(e.key==="ArrowRight"){

        nextPage();
    }

    if(e.key==="ArrowLeft"){

        prevPage();
    }
});

</script>

</body>
</html>
