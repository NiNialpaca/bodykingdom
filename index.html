<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>身體王國大冒險</title>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- turn.js -->
<script src="https://cdn.jsdelivr.net/gh/blasten/turn.js/turn.min.js"></script>

<style>

body{

    margin:0;

    overflow:hidden;

    background:
    linear-gradient(
    to bottom,
    #ffd6ec,
    #dff6ff
    );

    font-family:
    "Noto Sans TC",
    sans-serif;
}

/* 作者 */

.author{

    position:fixed;

    top:20px;

    left:50%;

    transform:translateX(-50%);

    z-index:999;

    background:
    rgba(255,255,255,0.7);

    padding:10px 24px;

    border-radius:999px;

    backdrop-filter:blur(10px);

    font-size:18px;

    color:#666;
}

/* 書本置中 */

.book-container{

    width:100vw;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;
}

/* 書 */

#flipbook{

    width:1400px;

    height:850px;
}

/* 每頁 */

#flipbook .page{

    background:transparent;

    overflow:hidden;
}

/* 圖片 */

#flipbook img{

    width:100%;

    height:100%;

    object-fit:contain;

    user-select:none;

    -webkit-user-drag:none;
}

/* 按鈕 */

.controls{

    position:fixed;

    bottom:20px;

    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:20px;

    z-index:999;
}

button{

    padding:14px 28px;

    border:none;

    border-radius:999px;

    background:#ff90c2;

    color:white;

    font-size:1rem;

    cursor:pointer;

    transition:0.3s;
}

button:hover{

    background:#ff5fa2;

    transform:scale(1.05);
}

/* 手機 */

@media(max-width:1100px){

    #flipbook{

        width:95vw;

        height:65vw;
    }

    .author{

        font-size:14px;
    }
}

</style>

</head>

<body>

<!-- 作者 -->

<div class="author">

作者：高芮妮、李涵羚、張鈺汶

</div>

<!-- 書 -->

<div class="book-container">

<div id="flipbook">

    <!-- 封面 -->
    <div class="page">
    <img src="cover.jpg">
    </div>

    <!-- 跨頁 -->

    <div class="page">
    <img src="spread1.jpg">
    </div>

    <div class="page">
    <img src="spread2.jpg">
    </div>

    <div class="page">
    <img src="spread3.jpg">
    </div>

    <div class="page">
    <img src="spread4.jpg">
    </div>

    <div class="page">
    <img src="spread5.jpg">
    </div>

    <div class="page">
    <img src="spread6.jpg">
    </div>

    <div class="page">
    <img src="spread7.jpg">
    </div>

    <div class="page">
    <img src="spread8.jpg">
    </div>

    <div class="page">
    <img src="spread9.jpg">
    </div>

    <!-- 封底 -->
    <div class="page">
    <img src="backcover.jpg">
    </div>

</div>

</div>

<!-- 按鈕 -->

<div class="controls">

<button id="prevBtn">
⬅ 上一頁
</button>

<button id="nextBtn">
下一頁 ➡
</button>

</div>

<script>

/* 建立翻頁書 */

$("#flipbook").turn({

    display:"single",

    width:1400,

    height:850,

    autoCenter:true,

    gradients:true,

    elevation:50,

    duration:1200

});

/* 按鈕翻頁 */

document
.getElementById("nextBtn")
.addEventListener(
"click",

function(){

    $("#flipbook")
    .turn("next");
});

document
.getElementById("prevBtn")
.addEventListener(
"click",

function(){

    $("#flipbook")
    .turn("previous");
});

/* 鍵盤翻頁 */

document.addEventListener(
"keydown",

function(e){

    if(e.key==="ArrowRight"){

        $("#flipbook")
        .turn("next");
    }

    if(e.key==="ArrowLeft"){

        $("#flipbook")
        .turn("previous");
    }
});

/* 手機左右滑 */

let startX = 0;

document.addEventListener(
"touchstart",

function(e){

    startX =
    e.changedTouches[0].screenX;
});

document.addEventListener(
"touchend",

function(e){

    let endX =
    e.changedTouches[0].screenX;

    /* 左滑 */

    if(startX - endX > 50){

        $("#flipbook")
        .turn("next");
    }

    /* 右滑 */

    if(endX - startX > 50){

        $("#flipbook")
        .turn("previous");
    }
});

</script>

</body>

</html>
